name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Setup Wrangler auth
        run: |
          mkdir -p ~/.config/.wrangler/config
          cat > ~/.config/.wrangler/config/default.toml << TOKEN_EOF
          oauth_token = "${{ secrets.CF_OAUTH_TOKEN }}"
          expiration_time = "2030-01-01T00:00:00.000Z"
          refresh_token = "${{ secrets.CF_REFRESH_TOKEN }}"
          scopes = ["pages:write", "account:read", "user:read"]
          TOKEN_EOF

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy out --project-name=trato-hecho --commit-dirty=true
