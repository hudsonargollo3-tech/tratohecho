name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set in this repo's Actions secrets."; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is not set in this repo's Actions secrets."; exit 1; fi
          echo "CLOUDFLARE_API_TOKEN present (len ${#CF_TOKEN})"
          echo "CLOUDFLARE_ACCOUNT_ID present (len ${#CF_ACCOUNT})"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=trato-hecho --commit-dirty=true
